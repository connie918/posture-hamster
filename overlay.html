   for(let j=0;j<2;j++)segs.push({x0:p[j][0],y0:p[j][1],x1:p[j+1][0],y1:p[j+1][1],w:.5*d,o:rr<60?.6:.35,t:rrd+20*d})}}}
 segs.sort((a,b)=>a.t-b.t);
 // shattered core
 const core=()=>{x.save();for(let i=0;i<40;i++){const a=rnd(0,7),r=rnd(0,13)*d,s=rnd(2,6)*d;x.beginPath();const px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r;x.moveTo(px,py);for(let j=0;j<3;j++)x.lineTo(px+rnd(-s,s),py+rnd(-s,s));x.closePath();x.fillStyle=`rgba(255,255,255,${rnd(.25,.7)})`;x.fill();x.strokeStyle=`rgba(40,45,50,${rnd(.15,.4)})`;x.lineWidth=.5*d;x.stroke()}
  const g=x.createRadialGradient(cx,cy,0,cx,cy,22*d);g.addColorStop(0,'rgba(255,255,255,.55)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.beginPath();x.arc(cx,cy,22*d,0,7);x.fill();x.restore()};
 core();let i=0;const t0=performance.now(),speed=R/160;
 (function step(now){const lim=(now-t0)*speed;x.lineCap='round';while(i<segs.length&&segs[i].t<=lim){const s=segs[i++];
   x.beginPath();x.moveTo(s.x0+.7*d,s.y0+.7*d);x.lineTo(s.x1+.7*d,s.y1+.7*d);x.strokeStyle=`rgba(20,24,28,${s.o*.75})`;x.lineWidth=s.w;x.stroke();
   x.beginPath();x.moveTo(s.x0,s.y0);x.lineTo(s.x1,s.y1);x.strokeStyle=`rgba(255,255,255,${s.o})`;x.lineWidth=s.w*.8;x.stroke()}
  if(i<segs.length)requestAnimationFrame(step)})(t0)}

function bonk(){pose('angry');say('');pet.classList.remove('hop','puff');const W=innerWidth,H=innerHeight,S=cur.S;
 const WW=W-INS.l-INS.r,WH=H-INS.t-INS.b;const sc=Math.min(1.9,(WH*.78)/S,(WW*.78)/S);const half=S*sc/2+16;
 const cx=Math.max(INS.l+half,Math.min(W-INS.r-half,INS.l+WW/2+rnd(-WW*.06,WW*.06))),cy=Math.max(INS.t+half,Math.min(H-INS.b-half,INS.t+WH*.5+rnd(-WH*.04,WH*.04)));
 const dx=cx-(cur.x+S/2),dy=cy-(cur.y+S/2),T=(x,y,s,sx=1,sy=1,r=0,rx=0)=>`translate(${x}px,${y}px) perspective(900px) rotateX(${rx}deg) rotate(${r}deg) scale(${s*sx},${s*sy})`;
 const k=[{transform:T(0,0,1),offset:0},{transform:T(dx*.15,dy*.15+30,1.05,1.06,.92),offset:.12},{transform:T(dx*.85,dy*.85,sc*.8,.96,1.05,-3),offset:.48},
  {transform:T(dx,dy,sc,1.22,.8,0,10),offset:.56},{transform:T(dx,dy+6,sc,1.16,.85,0,8),offset:.62},{transform:T(dx,dy+4,sc,1.18,.83,.6,8),offset:.7},
  {transform:T(dx,dy+40,sc*.98,1.12,.88,2,6),offset:.8},{transform:T(dx+10,dy+H*.55,sc*.92,1.02,.98,6,2),offset:1}];
 const a=pet.animate(k,{duration:2600,easing:'linear'});const tImp=2600*.56;
 setTimeout(()=>{impact(cx,cy+S*sc*.05,S*sc)},tImp);
 a.onfinish=()=>{pet.animate([{transform:'translateY(110%)'},{transform:'translateY(0)'}],{duration:700,easing:'cubic-bezier(.16,1,.3,1)'});if(attacking)setTimeout(()=>say(pick(C.LINES[4])),500)}}
function impact(cx,cy,size){noise(.25,160,.7,.9);noise(.6,4200,.4,.3);setTimeout(()=>noise(.4,6000,.3,.12),60);
 const sm=document.createElement('div');sm.className='fog';const w=size*.55,h=size*.42;
 sm.style.cssText=`left:${cx-w/2}px;top:${cy-h/2}px;width:${w}px;height:${h}px;border-radius:50%;background:radial-gradient(ellipse at 50% 45%,rgba(255,255,255,.55),rgba(235,238,240,.35) 45%,rgba(255,255,255,0) 70%);filter:blur(6px);mix-blend-mode:screen;backdrop-filter:blur(2px) brightness(1.05);transform:translate(0,0)`;
 sm.innerHTML=`<div style="position:absolute;left:46%;top:44%;width:8%;height:6%;border-radius:50%;background:rgba(120,110,105,.12);filter:blur(3px)"></div><div style="position:absolute;left:30%;top:68%;width:9%;height:7%;border-radius:50%;background:rgba(150,120,120,.1);filter:blur(3px)"></div><div style="position:absolute;left:61%;top:68%;width:9%;height:7%;border-radius:50%;background:rgba(150,120,120,.1);filter:blur(3px)"></div>`;
 fx.appendChild(sm);{const live=[...fx.querySelectorAll('.fog')].filter(f=>!f._gone);if(live.length>MAXF)live.slice(0,live.length-MAXF).forEach(f=>fadeOut(f,400))}sm.animate([{opacity:0},{opacity:1,offset:.05},{opacity:.75,offset:.35},{opacity:0}],{duration:rnd(1600,2400),easing:'ease-out',fill:'forwards'}).onfinish=()=>sm.remove();
 crack(cx,cy);dshake()}
function dshake(){const k=[];const A=14;for(let i=0;i<=14;i++){const d=Math.exp(-i/3.2)*A*(i%2?-1:1);k.push({transform:`translate(${d*.8}px,${d*.5}px)`})}k.push({transform:'translate(0,0)'});document.body.animate(k,{duration:700,easing:'linear'})}
function attack(l){attacking=true;level=l;clearInterval(timer);clearTimeout(peekT);pet.className='pet';
 const big=l===4?300:260;const vis=!!pet.dataset.show&&pet.style.transform===pet.dataset.show;let lag=0;
 if(vis){pet.getAnimations().forEach(a=>a.cancel());say('');pet.style.transition='transform .42s cubic-bezier(.55,0,.85,.35)';pet.style.transform=pet.dataset.hid;lag=440}
 setTimeout(()=>{if(!attacking||level!==l)return;setPet(pick(['bottom','floorL','floorR']),big,true);pose(l>=3?'angry':'neutral');squeak()},lag);setTimeout(()=>say(pick(C.LINES[l])),500+lag);
 setTimeout(()=>act(l),900+lag);timer=setInterval(()=>act(l),l===4?4200:l===1?2800:3400);
 if(!window.DEMO){st.n++;localStorage.pc=JSON.stringify(st);$('#cnt').textContent=st.n;window.api&&api.count(st.n)}

let lm,base=null,last=null,badSince=0,goodSince=Date.now();
$('#start').onclick=async()=>{setSt('加载模型中…');try{
 const {PoseLandmarker,FilesetResolver}=await import('./vendor/vision_bundle.mjs');

 const mk=d=>PoseLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:'app://local/vendor/pose_landmarker_lite.task',delegate:d},runningMode:'VIDEO',numPoses:1});try{if(location.search.includes('cpu'))throw 0;lm=await mk('GPU')}catch(e){lm=await mk('CPU')};window.mkLM=mk;
 const v=$('#v');v.srcObject=await navigator.mediaDevices.getUserMedia({video:{width:640,height:480}});await v.play();
 $('#cam').classList.remove('hide');$('#cal').disabled=false;setSt('请坐正后点击校准');if('Notification'in window)Notification.requestPermission();loop()}catch(e){setSt('无法开启：'+e.message)}};

const SIG={drop:['低头/驼背',.13],fwd:['头前伸',.23],lean:['靠太近',.10],tilt:['肩膀歪',.08],sink:['身体下沉',.10]};
const SF={1:2,3:1.5,5:1,7:.7,9:.5};let sensLv=5;const HOLD=3000;
function thr(k){return SIG[k][1]*(SF[sensLv]||1)}
function feat(p){const n=p[0],le=p[7],re=p[8],ls=p[11],rs=p[12];const sw=Math.hypot(ls.x-rs.x,ls.y-rs.y)||1e-3;const sy=(ls.y+rs.y)/2,sz=(ls.z+rs.z)/2,ez=(le.z+re.z)/2;
 return{neck:(sy-n.y)/sw,fz:(sz-ez)/sw,ed:Math.hypot(le.x-re.x,le.y-re.y),sw,tilt:(ls.y-rs.y)/sw,sy}}
let ema=null,calibBuf=null;try{base=JSON.parse(localStorage.pcBase||'null')}catch{}

 const m={};for(const k of Object.keys(calibBuf[0]))m[k]=calibBuf.reduce((a,f)=>a+f[k],0)/calibBuf.length;base=m;localStorage.pcBase=JSON.stringify(m);calibBuf=null;window.api&&api.needCalib(false);report('已校准 ✓ 现在可以关闭窗口');setSt('已校准，保持哦','ok')},2000)}

const dbg=document.createElement('div');dbg.style.cssText='position:fixed;right:16px;top:40px;z-index:50;background:rgba(17,17,17,.82);color:#fff;font:12px/1.7 Menlo,monospace;padding:10px 14px;border-radius:12px;display:none;white-space:pre;backdrop-filter:blur(10px)';document.body.appendChild(dbg);
window.setDebug=v=>dbg.style.display=v?'block':'none';
let autoCal=false,seenSince=0,farSince=0,lastSuggest=0;
function loop(){const v=$('#v');const now=Date.now();let info='未检测到人',sg=null,bad=[];
 try{if(v.readyState>=2){let r;if(window.USE_ID){const cc=window._cc||(window._cc=document.createElement('canvas'));cc.width=v.videoWidth;cc.height=v.videoHeight;const g=cc.getContext('2d',{willReadFrequently:true});g.drawImage(v,0,0);r=lm.detectForVideo(g.getImageData(0,0,cc.width,cc.height),performance.now())}else{try{r=lm.detectForVideo(v,performance.now())}catch(e){window.USE_ID=1;throw e}}const p=r.landmarks&&r.landmarks[0];
  if(p&&p[11].visibility>.4&&p[12].visibility>.4&&p[0].visibility>.4){info='检测到人';const f=feat(p);
   ema=ema?Object.fromEntries(Object.keys(f).map(k=>[k,ema[k]*.7+f[k]*.3])):f;last=ema;if(calibBuf)calibBuf.push(f);
   seenSince=seenSince||now;
   sg=signals(ema);if(sg){const far=Object.keys(SIG).some(k=>sg[k]>thr(k)*3);if(far){farSince=farSince||now;if(now-farSince>60000&&now-lastSuggest>600000){lastSuggest=now;window.api&&api.suggest()}}else farSince=0}if(sg)for(const k in SIG)if(sg[k]>thr(k))bad.push(SIG[k][0])}else{seenSince=0;ema=null}}}catch(e){info='检测出错 '+e.message;if(!window.CPUF&&window.mkLM){window.CPUF=1;window.mkLM('CPU').then(x=>{lm=x})}}
 if(sg&&!calibBuf){if(bad.length){goodSince=0;badSince=badSince||now;const pr=Math.min(1,(now-badSince)/HOLD);setSt(bad.join(' · '),'bad');if(pr>=1&&!attacking&&!window.PAUSED)attack(Math.min(4,level+1))}
  else{badSince=0;goodSince=goodSince||now;setSt('坐姿很棒','ok');calm();if(level&&now-goodSince>20000)level=0}}else badSince=0;
 if(dbg.style.display==='block'){let t=`${info}${base?'':' · 未校准'}${window.PAUSED?' · 已暂停':''}\n灵敏度 ${sensLv}  持续 ${HOLD/1000}s\n`;
