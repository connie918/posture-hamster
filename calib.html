<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>校准坐姿</title><style>
body{margin:0;font-family:Montserrat,"PingFang SC",sans-serif;background:#fafafa;color:#111;padding:24px;-webkit-user-select:none}
.e{font-size:11px;letter-spacing:.2em;color:#8a8a8a}h2{margin:6px 0 6px;font-size:21px}.sub{font-size:13px;color:#666;line-height:1.7;margin:0 0 14px}
.v{position:relative}video{width:100%;border-radius:16px;transform:scaleX(-1);background:#111;display:block;aspect-ratio:4/3;object-fit:cover}
#cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:96px;font-weight:300;color:#fff;text-shadow:0 4px 24px rgba(0,0,0,.4);opacity:0;transition:opacity .2s}
#ring{position:absolute;inset:0;border-radius:16px;box-shadow:inset 0 0 0 0 #fff;transition:box-shadow .4s}
.rec #ring{box-shadow:inset 0 0 0 4px #fff}
button{margin-top:16px;width:100%;font:inherit;font-weight:500;font-size:14px;border:0;background:#111;color:#fff;padding:13px;border-radius:999px;cursor:pointer;transition:transform .2s}
button:disabled{opacity:.5}ol{font-size:12px;color:#777;line-height:1.9;padding-left:18px;margin:12px 0 0}
.ok h2{color:#111}#t{font-size:13px;color:#555;margin-top:10px;min-height:20px;text-align:center}</style></head><body>
<div class="e">CALIBRATE · 校准</div><h2 id="h">先坐正，让小仓鼠记住你的标准坐姿</h2><p class="sub">校准之后它才会开始盯着你。画面只在这台电脑上处理，不会上传。</p>
<div class="v" id="vv"><video id="v" autoplay playsinline muted></video><div id="ring"></div><div id="cd"></div></div>
<button id="b">我坐好了，开始校准</button><div id="t"></div>
<ol id="tips"><li>背挺直，肩膀放松，脸正对屏幕</li><li>肩膀和头都要在画面里</li><li>点按钮后倒数 3 秒，再保持 2 秒不动</li></ol>
<script>
navigator.mediaDevices.getUserMedia({video:true}).then(s=>v.srcObject=s).catch(e=>t.textContent='无法打开摄像头：'+e.message);
const sl=ms=>new Promise(r=>setTimeout(r,ms));
api.onStatus(x=>{if(x.startsWith('已校准')){document.body.classList.add('ok');vv.classList.remove('rec');h.textContent='校准好啦 ✓';t.textContent='小仓鼠记住你的坐姿了，可以关闭这个窗口。坐歪了它会来找你哦。';b.disabled=false;b.textContent='重新校准';cd.style.opacity=0}
 else if(x.startsWith('没检测')){vv.classList.remove('rec');t.textContent=x;b.disabled=false;b.textContent='再试一次'}});
b.onclick=async()=>{b.disabled=true;t.textContent='';cd.style.opacity=1;for(const n of [3,2,1]){cd.textContent=n;await sl(1000)}cd.textContent='';vv.classList.add('rec');t.textContent='保持不动…';api.calibrate()};
</script></body></html>
